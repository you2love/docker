spin_manifest_version = 3

[application]
name = "wasm-hello-world"
version = "1.0.0"
description = "A simple WASM HTTP server"

[[trigger.http]]
route = "/..."
component = "hello-world"

[component.hello-world]
source = "app.wasm"
# 或者使用 Rust、Go 等语言编译的 WASM
# source = "target/wasm32-wasi/release/hello_world.wasm"

# 环境变量
[component.hello-world.variables]
message = "Hello from WASM!"

# 如果使用 Rust 组件
# [component.hello-world.build]
# command = "cargo build --target wasm32-wasi --release"
# workdir = "."

# 如果使用 Python 组件
# [component.hello-world.build]
# command = "spin py2wasm app -o app.wasm"
# workdir = "."
