<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Web 应用示例</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .whale {
            font-size: 100px;
            margin: 20px 0;
            animation: swim 3s ease-in-out infinite;
        }

        @keyframes swim {
            0%, 100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(10deg);
            }
        }

        p {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .status {
            background: #f0f9ff;
            border-left: 4px solid #0ea5e9;
            padding: 20px;
            margin: 30px 0;
            text-align: left;
        }

        .status h3 {
            color: #0ea5e9;
            margin-bottom: 10px;
        }

        .info {
            background: #f0fdf4;
            border-left: 4px solid #22c55e;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .info h3 {
            color: #22c55e;
            margin-bottom: 10px;
        }

        .badge {
            display: inline-block;
            background: #0ea5e9;
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: bold;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="whale">🐳</div>
        <h1>Docker Web 应用示例</h1>
        <p>这是一个使用 Docker 和 Nginx 部署的静态网站示例</p>

        <div class="badge">运行在 Docker 容器中</div>

        <div class="status">
            <h3>📊 系统状态</h3>
            <p><strong>容器状态：</strong>运行中</p>
            <p><strong>Web 服务器：</strong>Nginx</p>
            <p><strong>部署方式：</strong>Docker 容器</p>
        </div>

        <div class="info">
            <h3>🚀 快速开始</h3>
            <p>构建镜像：</p>
            <code style="background: #f1f5f9; padding: 10px; display: block; margin: 10px 0; border-radius: 5px;">
                docker build -t my-web-app .
            </code>
            <p>运行容器：</p>
            <code style="background: #f1f5f9; padding: 10px; display: block; margin: 10px 0; border-radius: 5px;">
                docker run -d -p 8080:80 my-web-app
            </code>
        </div>

        <p style="margin-top: 30px; color: #888; font-size: 0.9em;">
            访问 <a href="http://localhost:8080" style="color: #0ea5e9; text-decoration: none;">http://localhost:8080</a> 查看此页面
        </p>
    </div>
</body>
</html>
